<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#111827" />
  <title>Brainy Arena</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" class="app-shell">
    <section id="playerScreen" class="screen active" aria-labelledby="playerTitle">
      <header class="topbar">
        <div>
          <div class="brand-lockup">
            <span class="brand-symbol" aria-hidden="true">B</span>
            <p class="eyebrow">BRAINY ARENA</p>
          </div>
          <h1 id="playerTitle">誰要來挑戰？</h1>
        </div>
        <div id="currentPlayerBadge" class="player-badge">尚未選擇玩家</div>
      </header>

      <div class="single-step-layout">
        <section class="panel player-panel">
          <h2>選擇玩家</h2>
          <div id="playerList" class="player-list focus-grid"></div>
          <div class="inline-actions">
            <button class="btn secondary" data-action="add-player">＋ 新增玩家</button>
            <button class="btn danger" data-action="manage-player">玩家管理</button>
            <button class="btn primary step-next" data-action="choose-game">下一步：選遊戲</button>
          </div>
        </section>
      </div>
    </section>

    <section id="gamesScreen" class="screen" aria-labelledby="gamesTitle">
      <header class="topbar">
        <div><p class="eyebrow">步驟 2</p><h1 id="gamesTitle">選擇遊戲</h1></div>
        <div class="player-badge selected-player-badge">—</div>
      </header>
      <section class="games-section panel">
        <div class="game-cards focus-grid">
          <button class="game-card featured" data-game="multiplication">
            <span class="game-icon">×</span>
            <span class="game-copy"><strong>九九乘法</strong><small>隨機出題・錯題加強</small></span>
          </button>
          <button class="game-card addition-card" data-game="addition"><span class="game-icon">＋</span><span class="game-copy"><strong>加法挑戰</strong><small>個位・十位・百位</small></span></button>
          <button class="game-card subtraction-card" data-game="subtraction"><span class="game-icon">−</span><span class="game-copy"><strong>減法挑戰</strong><small>個位・十位・百位</small></span></button>
        </div>
        <section class="leaderboard-overview" aria-labelledby="leaderboardTitle">
          <div class="leaderboard-overview-heading">
            <h2 id="leaderboardTitle">🏆 全遊戲排行榜</h2>
            <span>最高分玩家・同分並列</span>
          </div>
          <div id="gameLeaderboards" class="leaderboard-grid"></div>
        </section>
        <div class="inline-actions"><button class="btn secondary" data-action="back-players">返回選玩家</button></div>
      </section>
    </section>

    <section id="settingsScreen" class="screen" aria-labelledby="settingsTitle">
      <header class="topbar">
        <div><p class="eyebrow">步驟 3</p><h1 id="settingsTitle">九九乘法設定</h1></div>
        <div class="player-badge selected-player-badge">—</div>
      </header>
      <section class="panel settings-panel">
        <div class="settings-layout">
          <div class="settings-controls">
            <div class="fixed-duration"><span>每局時間</span><strong>60 秒</strong></div>
            <div id="levelSetting" class="setting-block">
              <span class="setting-label">數字範圍</span>
              <div class="segmented focus-grid" id="levelOptions">
                <button class="option selected" data-level="ones">個位數</button>
                <button class="option" data-level="tens">十位數</button>
                <button class="option" data-level="hundreds">百位數</button>
              </div>
            </div>
            <div class="setting-block">
              <span class="setting-label">答題模式</span>
              <div class="segmented focus-grid" id="modeOptions">
                <button class="option selected" data-mode="choice">四選一</button>
                <button class="option" data-mode="keypad">數字輸入</button>
              </div>
            </div>
            <div id="multiplicationTableSetting" class="setting-block multiplication-table-setting">
              <span class="setting-label">學習小幫手</span>
              <button class="btn secondary" data-action="open-multiplication-table">▦ 查看完整九九乘法表</button>
            </div>
            <div class="inline-actions settings-actions">
              <button class="btn secondary" data-action="back-games">返回選遊戲</button>
              <button class="btn primary" data-action="start-game">開始遊戲</button>
            </div>
          </div>
          <aside class="scoreboard" aria-labelledby="scoreboardTitle">
            <div class="scoreboard-heading">
              <span>本遊戲紀錄</span>
              <strong id="scoreboardTitle">—</strong>
            </div>
            <div id="scoreboardRows" class="scoreboard-rows"></div>
          </aside>
        </div>
      </section>
    </section>

    <section id="manageScreen" class="screen" aria-labelledby="manageTitle">
      <header class="topbar">
        <div><p class="eyebrow">家長功能</p><h1 id="manageTitle">玩家管理</h1></div>
      </header>
      <section class="panel manage-screen-panel">
        <div id="managePlayerList" class="manage-list"></div>
        <div id="manageConfirmation" class="confirmation-panel hidden">
          <p id="manageConfirmText" class="confirmation-text"></p>
          <div class="dialog-actions">
            <button class="btn primary" data-action="cancel-player-action">取消</button>
            <button class="btn danger" data-action="confirm-player-action">確定</button>
          </div>
        </div>
        <div id="manageDoneActions" class="dialog-actions"><button class="btn secondary" data-action="close-manage">完成，回玩家首頁</button></div>
      </section>
    </section>

    <section id="gameScreen" class="screen" aria-labelledby="questionText">
      <div class="game-hud">
        <div><span class="hud-label">玩家</span><strong id="hudPlayer">—</strong></div>
        <div><span class="hud-label">分數</span><strong id="scoreText">0</strong></div>
        <div class="countdown"><span class="hud-label">還剩下</span><strong><span id="timeText">60</span> 秒</strong></div>
        <button class="exit-game-btn" data-action="exit-game" aria-label="退出目前遊戲">退出遊戲</button>
      </div>
      <div class="timer-track" aria-hidden="true"><div id="timerProgress" class="timer-progress"></div></div>

      <div class="question-wrap">
        <p id="questionMeta" class="question-meta">第 1 題</p>
        <h2 id="questionText" class="question-text">6 × 7 = ?</h2>
        <div id="feedback" class="feedback" aria-live="polite"></div>
      </div>

      <div id="choiceArea" class="answers-grid focus-grid"></div>
      <div id="keypadArea" class="keypad-wrap hidden">
        <div id="keypadDisplay" class="keypad-display">_</div>
        <div id="keypadGrid" class="keypad-grid focus-grid"></div>
      </div>

      <div class="game-footer">
        <p id="remoteHint" class="remote-hint">方向鍵選擇答案・OK 確認</p>
      </div>
    </section>

    <section id="resultScreen" class="screen result-screen">
      <p class="eyebrow">本輪完成</p>
      <h2 id="resultTitle">做得很好！</h2>
      <div class="result-score"><span id="finalScore">0</span><small>分</small></div>
      <div class="stats-grid">
        <div><span>答對</span><strong id="correctCount">0</strong></div>
        <div><span>答錯</span><strong id="wrongCount">0</strong></div>
        <div><span>正確率</span><strong id="accuracyText">0%</strong></div>
        <div><span id="highScoreLabel">本級最高</span><strong id="highScoreText">0</strong></div>
      </div>
      <div class="result-actions focus-grid">
        <button class="btn primary" data-action="play-again">再玩一次</button>
        <button class="btn secondary" data-action="back-home">回首頁</button>
      </div>
    </section>
  </main>

  <dialog id="playerDialog" class="dialog">
    <form method="dialog" id="playerForm" class="dialog-card">
      <h2>新增玩家</h2>
      <label for="playerName">玩家名稱</label>
      <input id="playerName" name="playerName" maxlength="12" autocomplete="off" placeholder="例如：小宇" />
      <div class="dialog-actions">
        <button value="cancel" class="btn secondary">取消</button>
        <button value="default" class="btn primary" id="savePlayerButton">新增</button>
      </div>
    </form>
  </dialog>

  <dialog id="exitDialog" class="dialog">
    <div class="dialog-card exit-confirmation">
      <h2>要離開這一局嗎？</h2>
      <p>這一局的分數不會保留。</p>
      <div class="dialog-actions">
        <button class="btn primary" data-action="continue-game">繼續玩</button>
        <button class="btn danger" data-action="confirm-exit">離開遊戲</button>
      </div>
    </div>
  </dialog>

  <dialog id="multiplicationTableDialog" class="dialog">
    <div class="dialog-card multiplication-table-dialog-card">
      <div class="multiplication-table-header">
        <div>
          <p class="eyebrow">學習小幫手</p>
          <h2>九九乘法表</h2>
        </div>
        <p>從 2 到 9，一次看完！</p>
      </div>
      <div id="multiplicationTableGrid" class="multiplication-table-grid" aria-label="二到九的九九乘法表"></div>
      <div class="dialog-actions multiplication-table-actions">
        <button class="btn primary" data-action="close-multiplication-table">看完了，回到設定</button>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>家庭學習遊戲</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" class="app-shell">
    <section id="playerScreen" class="screen active" aria-labelledby="playerTitle">
      <header class="topbar">
        <div>
          <p class="eyebrow">Google TV 家庭學習</p>
          <h1 id="playerTitle">誰要來挑戰？</h1>
        </div>
        <div id="currentPlayerBadge" class="player-badge">尚未選擇玩家</div>
      </header>

      <p class="tv-bro-hint">
        TV Bro 建議：長按 OK 開啟選單，啟用「Direct navigation／直接導覽」，即可用方向鍵切換按鈕。
      </p>

      <div class="single-step-layout">
        <section class="panel player-panel">
          <h2>選擇玩家</h2>
          <div id="playerList" class="player-list focus-grid"></div>
          <div class="inline-actions">
            <button class="btn secondary" data-action="add-player">＋ 新增玩家</button>
            <button class="btn danger" data-action="manage-player">玩家管理</button>
            <button class="btn primary step-next" data-action="choose-game">下一步：選遊戲</button>
          </div>
        </section>
      </div>
    </section>

    <section id="gamesScreen" class="screen" aria-labelledby="gamesTitle">
      <header class="topbar">
        <div><p class="eyebrow">步驟 2</p><h1 id="gamesTitle">選擇遊戲</h1></div>
        <div class="player-badge selected-player-badge">—</div>
      </header>
      <section class="games-section panel">
        <div class="game-cards focus-grid">
          <button class="game-card featured" data-game="multiplication">
            <span class="game-icon">×</span>
            <span class="game-copy"><strong>九九乘法</strong><small>隨機出題・錯題加強</small></span>
          </button>
          <button class="game-card disabled" disabled><span class="game-icon">＋</span><span class="game-copy"><strong>加減法</strong><small>敬請期待</small></span></button>
          <button class="game-card disabled" disabled><span class="game-icon">A</span><span class="game-copy"><strong>英文單字</strong><small>敬請期待</small></span></button>
          <button class="game-card disabled" disabled><span class="game-icon">字</span><span class="game-copy"><strong>國字練習</strong><small>敬請期待</small></span></button>
        </div>
        <div class="inline-actions"><button class="btn secondary" data-action="back-players">返回選玩家</button></div>
      </section>
    </section>

    <section id="settingsScreen" class="screen" aria-labelledby="settingsTitle">
      <header class="topbar">
        <div><p class="eyebrow">步驟 3</p><h1 id="settingsTitle">九九乘法設定</h1></div>
        <div class="player-badge selected-player-badge">—</div>
      </header>
      <section class="panel settings-panel">
        <div class="fixed-duration"><span>每局時間</span><strong>60 秒</strong></div>
        <div class="setting-block">
          <span class="setting-label">答題模式</span>
          <div class="segmented focus-grid" id="modeOptions">
            <button class="option selected" data-mode="choice">四選一</button>
            <button class="option" data-mode="keypad">數字輸入</button>
          </div>
        </div>
        <div class="inline-actions settings-actions">
          <button class="btn secondary" data-action="back-games">返回選遊戲</button>
          <button class="btn primary" data-action="start-game">開始遊戲</button>
        </div>
      </section>
    </section>

    <section id="gameScreen" class="screen" aria-labelledby="questionText">
      <div class="game-hud">
        <div><span class="hud-label">玩家</span><strong id="hudPlayer">—</strong></div>
        <div><span class="hud-label">分數</span><strong id="scoreText">0</strong></div>
        <div class="countdown"><span class="hud-label">還剩下</span><strong><span id="timeText">60</span> 秒</strong></div>
      </div>
      <div class="timer-track" aria-hidden="true"><div id="timerProgress" class="timer-progress"></div></div>

      <div class="question-wrap">
        <p id="questionMeta" class="question-meta">第 1 題</p>
        <h2 id="questionText" class="question-text">6 × 7 = ?</h2>
        <div id="feedback" class="feedback" aria-live="polite"></div>
      </div>

      <div id="choiceArea" class="answers-grid focus-grid"></div>
      <div id="keypadArea" class="keypad-wrap hidden">
        <div id="keypadDisplay" class="keypad-display">_</div>
        <div id="keypadGrid" class="keypad-grid focus-grid"></div>
      </div>

      <p class="remote-hint">方向鍵移動・OK 確認</p>
    </section>

    <section id="resultScreen" class="screen result-screen">
      <p class="eyebrow">本輪完成</p>
      <h2 id="resultTitle">做得很好！</h2>
      <div class="result-score"><span id="finalScore">0</span><small>分</small></div>
      <div class="stats-grid">
        <div><span>答對</span><strong id="correctCount">0</strong></div>
        <div><span>答錯</span><strong id="wrongCount">0</strong></div>
        <div><span>正確率</span><strong id="accuracyText">0%</strong></div>
        <div><span>最高分</span><strong id="highScoreText">0</strong></div>
      </div>
      <div class="result-actions focus-grid">
        <button class="btn primary" data-action="play-again">再玩一次</button>
        <button class="btn secondary" data-action="back-home">回首頁</button>
      </div>
    </section>
  </main>

  <dialog id="playerDialog" class="dialog">
    <form method="dialog" id="playerForm" class="dialog-card">
      <h2>新增玩家</h2>
      <label for="playerName">玩家名稱</label>
      <input id="playerName" name="playerName" maxlength="12" autocomplete="off" placeholder="例如：小宇" />
      <div class="dialog-actions">
        <button value="cancel" class="btn secondary">取消</button>
        <button value="default" class="btn primary" id="savePlayerButton">新增</button>
      </div>
    </form>
  </dialog>

  <dialog id="manageDialog" class="dialog">
    <div class="dialog-card wide">
      <h2>玩家管理</h2>
      <div id="managePlayerList" class="manage-list"></div>
      <div class="dialog-actions"><button class="btn secondary" data-action="close-manage">完成</button></div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
